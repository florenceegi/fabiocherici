name: Deploy fabiocherici.com

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: npm install && npm run build

      - name: Sync to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::504606041369:role/github-actions-deploy-florenceegi
          aws-region: eu-north-1

      - name: Upload to S3
        run: aws s3 sync out/ s3://fabiocherici.com --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3NTB3ULRPGM91 --paths "/*" --region us-east-1
